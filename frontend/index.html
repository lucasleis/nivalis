<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Nivalis | Agencia de Desarrollo Web Moderno y Marketing Digital</title>
    <meta name="title" content="Nivalis | Agencia de Desarrollo Web Moderno y Marketing Digital">
    <meta name="description" content="Agencia de desarrollo web, diseño UI/UX y soluciones digitales a medida. Creamos sitios, apps y sistemas que generan resultados reales para tu negocio.">
    <meta name="keywords" content="desarrollo web moderno, marketing digital, diseño UI/UX, desarrollo web Argentina, sitios web profesionales, apps, agencia digital, desarrollo web react, desarrollo web nextjs">
    <meta name="author" content="Nivalis Marketing & Tech Lab">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://nivalistechlab.com/">
    <meta name="language" content="Spanish">
    <meta name="revisit-after" content="7 days">
    <meta name="author" content="Nivalis Marketing & Tech Lab">
    <meta name="theme-color" content="#fd6647">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nivalistechlab.com/">
    <meta property="og:title" content="Nivalis | Agencia de Desarrollo Web Moderno y Marketing Digital">
    <meta property="og:description" content="Creamos soluciones digitales con desarrollo web moderno que generan resultados reales. Diseño UI/UX, apps y tecnología.">
    <meta property="og:image" content="https://nivalistechlab.com/og-image.png">
    <meta property="og:site_name" content="Nivalis">
    <meta property="og:locale" content="es_AR">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://nivalistechlab.com/">
    <meta property="twitter:title" content="Nivalis | Agencia de Desarrollo Web Moderno y Marketing Digital">
    <meta property="twitter:description" content="Creamos soluciones digitales con desarrollo web moderno que generan resultados reales. Diseño UI/UX, apps y tecnología.">
    <meta property="twitter:image" content="https://nivalistechlab.com/og-image.png">

    <!-- LCP image: preload logo (shown by Loader on first paint) -->
    <link rel="preload" as="image" href="/logo-A6.png" fetchpriority="high">

    <!-- Critical fonts: preload AcuminPro Regular + Bold (used by body and headings) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/AcuminPro-Regular.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/AcuminPro-Bold.woff2" crossorigin>

    <!-- Google Fonts: Space Mono (used by .hero-eyebrow) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/logo-nivalis.ico">

    <!-- Structured Data - WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Nivalis - Desarrollo Web Moderno y Marketing Digital",
      "url": "https://nivalistechlab.com/",
      "description": "Agencia de desarrollo web moderno y marketing digital en Argentina. Creamos sitios web, apps y soluciones digitales.",
      "publisher": {
        "@type": "Organization",
        "name": "Nivalis Marketing & Tech Lab"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://nivalistechlab.com/buscar?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Nivalis Marketing & Tech Lab",
      "url": "https://nivalistechlab.com/",
      "logo": "https://nivalistechlab.com/logo-nivalis.png",
      "description": "Agencia de desarrollo web moderno, diseño UI/UX y marketing digital.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Buenos Aires",
        "addressRegion": "Buenos Aires",
        "addressCountry": "AR"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+5491151232153",
        "contactType": "customer service",
        "availableLanguage": "Spanish"
      },
      "sameAs": [
        "https://www.instagram.com/nivalis.techlab/",
        "https://www.facebook.com/nivalis.techlab"
      ],
      "priceRange": "$$"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
